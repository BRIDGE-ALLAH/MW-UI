name: Moonwitness UI CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: moonwitness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeScript imports generated registry styles; prepare them before checks.
      - name: Build workspace packages and registry styles
        run: |
          pnpm build:packages
          pnpm --filter=v4 registry:build --style all

      - name: Preview formatting fixes for tracked application files
        run: |
          pnpm --filter=v4 exec prettier --write \
            "app/(app)/(root)/page.tsx" \
            "app/(app)/layout.tsx" \
            "app/opengraph-image.tsx" \
            "components/site-footer.tsx" \
            "components/site-header.tsx" \
            "content/docs/(root)/moonwitness-ui.mdx" \
            "lib/registry-health/blob.test.ts" \
            "scripts/build-test-app.mts" \
            "scripts/capture-explore.mts" \
            "scripts/monitor-registries.mts"
          git diff --unified=3 -- apps/v4

      - name: Run quality checks
        run: pnpm check

      - name: Typecheck maintenance scripts
        run: pnpm --filter=v4 exec tsc --noEmit --project tsconfig.scripts.json

      - name: Validate public registry metadata
        run: pnpm validate:registries

      - name: Test self-hosted registry health storage
        run: pnpm --filter=v4 exec vitest run lib/registry-health/blob.test.ts

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Moonwitness UI
        run: pnpm v4:build
        env:
          NEXT_PUBLIC_APP_URL: https://ui.moonwitness.biz.id
