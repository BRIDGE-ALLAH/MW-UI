name: Moonwitness UI CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: moonwitness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, quality checks, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate workspace packages and registry styles before typechecking.
      # The app's TypeScript project imports generated registry artifacts.
      - name: Build workspace packages and registry styles
        run: |
          pnpm build:packages
          pnpm --filter=v4 registry:build --style all

      - name: Run lint, typecheck, and formatting checks
        run: pnpm check

      - name: Build Moonwitness UI
        run: pnpm v4:build
        env:
          NEXT_PUBLIC_APP_URL: https://ui.moonwitness.biz.id
